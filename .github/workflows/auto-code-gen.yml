name: Generate Code with Gemini

on:
  # Triggered via API from onflow
  repository_dispatch:
    types: [generate-code]
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode'
        required: false
        default: 'false'

jobs:
  generate-code:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Log trigger info
        run: |
          echo "🚀 Workflow triggered!"
          echo "Event: ${{ github.event_name }}"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Mask API key
        if: github.event.client_payload.api_key
        run: |
          # Mask the API key so it won't appear in logs
          echo "::add-mask::${{ github.event.client_payload.api_key }}"
      
      - name: Save feature spec
        if: github.event_name == 'repository_dispatch'
        env:
          FEATURE_JSON: ${{ toJson(github.event.client_payload.feature) }}
        run: |
          mkdir -p .gemini-specs
          echo "$FEATURE_JSON" > .gemini-specs/current-feature.json
          echo "📋 Feature spec saved:"
          cat .gemini-specs/current-feature.json | jq 'del(.annotatedImage, .screenshots)' 2>/dev/null || echo "(spec saved)"
      
      - name: Extract feature info
        id: feature-info
        run: |
          if [ -f ".gemini-specs/current-feature.json" ]; then
            TITLE=$(cat .gemini-specs/current-feature.json | jq -r '.title // "Unknown"' | head -c 50)
            TYPE=$(cat .gemini-specs/current-feature.json | jq -r '.type // "feature"')
          else
            TITLE="test-feature"
            TYPE="feature"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "branch_name=auto-gen/${{ github.run_number }}-$TYPE" >> $GITHUB_OUTPUT
          echo "📝 Title: $TITLE, Type: $TYPE"
      
      - name: Generate code with Gemini API
        if: github.event_name == 'repository_dispatch'
        env:
          # API key from trigger (masked above) or from repository secrets
          GEMINI_API_KEY: ${{ github.event.client_payload.api_key || secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ No GEMINI_API_KEY found."
            echo "Either pass it via the trigger or add it to repository secrets."
            exit 1
          fi
          echo "🤖 Generating code with Gemini..."
          node .github/scripts/generate-with-api.js
      
      - name: Apply generated code
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ -f ".gemini-specs/output.md" ]; then
            echo "📦 Applying generated code..."
            node .github/scripts/apply-changes.js .gemini-specs/output.md
          else
            echo "⚠️ No output file found"
          fi
      
      - name: Create Pull Request
        if: github.event_name == 'repository_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: ${{ steps.feature-info.outputs.title }}'
          branch: ${{ steps.feature-info.outputs.branch_name }}
          delete-branch: true
          title: '🤖 [${{ steps.feature-info.outputs.type }}] ${{ steps.feature-info.outputs.title }}'
          body: |
            ## Auto-Generated Code
            
            This PR was automatically generated by **Gemini** based on the feature specification.
            
            ### Feature Details
            - **Type:** ${{ steps.feature-info.outputs.type }}
            - **Title:** ${{ steps.feature-info.outputs.title }}
            
            ### ⚠️ Review Checklist
            - [ ] Code follows project conventions
            - [ ] All acceptance criteria met
            - [ ] No unintended side effects
            - [ ] Tests pass
            
            ---
            *Generated by onflow UX Analyzer*
          labels: |
            auto-generated
            needs-review

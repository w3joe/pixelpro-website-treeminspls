name: Auto Code Generation with Gemini

on:
  push:
    paths:
      - 'features/**/*.json'

jobs:
  generate-code:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get changed feature files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'features/.*\.json' | tr '\n' ',' | sed 's/,$//')
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"
      
      - name: Extract feature info
        id: feature-info
        run: |
          FEATURE_FILE=$(echo "${{ steps.changed-files.outputs.files }}" | cut -d',' -f1)
          if [ -f "$FEATURE_FILE" ]; then
            TITLE=$(jq -r '.title' "$FEATURE_FILE")
            TYPE=$(jq -r '.type' "$FEATURE_FILE")
            PRIORITY=$(jq -r '.priority' "$FEATURE_FILE")
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "type=$TYPE" >> $GITHUB_OUTPUT
            echo "priority=$PRIORITY" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install @google/generative-ai
      
      - name: Generate code with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEATURE_FILES: ${{ steps.changed-files.outputs.files }}
        run: node .github/scripts/generate-code.js
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: ${{ steps.feature-info.outputs.title }}'
          branch: auto-gen/${{ github.run_number }}-${{ steps.feature-info.outputs.type }}
          delete-branch: true
          title: '🤖 [${{ steps.feature-info.outputs.type }}] ${{ steps.feature-info.outputs.title }}'
          body: |
            ## Auto-Generated Code
            
            This PR was automatically generated by Gemini AI based on the feature specification.
            
            ### Feature Details
            - **Type:** ${{ steps.feature-info.outputs.type }}
            - **Priority:** ${{ steps.feature-info.outputs.priority }}
            - **Title:** ${{ steps.feature-info.outputs.title }}
            
            ### ⚠️ Review Checklist
            - [ ] Code follows project conventions
            - [ ] All acceptance criteria met
            - [ ] No unintended side effects
            - [ ] Tests pass
            
            **Generated from:** \`${{ steps.changed-files.outputs.files }}\`
          labels: |
            auto-generated
            needs-review
